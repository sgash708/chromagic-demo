name: Page VRT Approve

on:
  issue_comment:
    types: [created]

permissions:
  checks: write
  pull-requests: write

jobs:
  approve:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/chromagic approve') }}
    runs-on: ubuntu-latest
    steps:
      - uses: sgash708/chromagic@worktree-chromagic+page-vrt-approval
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: approve
